    - 'heading "Passionate and driven individual in the world of technology and engineering, combining business acumen with a dedication to solving complex problems through applying business-orientated approach to engineering challenges. I have had the privilege of exploring various facets of engineering landscape: Mechanical, Electrical to Robotics and Control & Systems Engineering." [level=4] [ref=e25]'
    - paragraph [ref=e26]: My journey in the world of engineering began with Mechanical engineering. I developed a deep fascination for the intricate workings of machinery and a keen eye for understanding how things are put together. This broadened my engineering horizon from the microscale of tiny gears to the macroscale of industrial machinery. With natural curiosity for electrifying the world, I ventured into electrical and control engineering during my undergraduate engineering with the focus on designing speed control systems for Tesla SP85. My journey took an exciting turn when I delved into control and systems engineering, with the focus on robotics. This discipline allowed me apply my knowledge of various engineering facets - Mechanical, Electrical, Controls and Software engineering to create systems that operate seamlessly and autonomously. My work in this field has led to innovations in automation, robotics, and autonomous vehicles. In the ever-changing landscape of technology and engineering, I am determined to explore new horizons and embark on innovative projects that challenge the limits of what we can achieve. I am always eager to collaborate with like-minded individuals who share my passion for engineering and the pursuit of groundbreaking solutions. Together, we can create a future where technology serves as a catalyst for positive change.
    - blockquote [ref=e27]: Let's connect and be part of exciting journey towards a more advanced, interconnected, and innovative world.
