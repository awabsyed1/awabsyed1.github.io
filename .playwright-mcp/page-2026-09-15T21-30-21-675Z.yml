    - article [ref=f6e12]:
      - heading "Docker Installation and Setup" [level=2] [ref=f6e13]
      - paragraph [ref=f6e14]:
        - strong [ref=f6e15]: "Posted on:"
        - text: January 24, 2024
      - paragraph [ref=f6e16]: "This blog will go through the complete process of installing and setting up Docker, exploring the basics of Docker images and containers. It also demonstrates how to create and manage containers with a practical example: containerizing the open-source ORB-SLAM3."
      - heading "What is Docker?" [level=3] [ref=f6e17]
      - paragraph [ref=f6e18]:
        - text: Docker is a platform that allows you to package an application and its dependencies into a
        - emphasis [ref=f6e19]: container
        - text: . This ensures software runs consistently across environments — your laptop, a colleague’s computer, or a remote server.
      - heading "Installing Docker" [level=3] [ref=f6e20]
      - paragraph [ref=f6e21]: "The installation process varies by operating system:"
      - list [ref=f6e22]:
        - listitem [ref=f6e23]:
          - strong [ref=f6e24]: "Linux (Ubuntu example):"
          - code [ref=f6e26]: sudo apt-get update sudo apt-get install docker.io
        - listitem [ref=f6e27]:
          - strong [ref=f6e28]: "Windows & macOS:"
          - text: Download Docker Desktop from the
          - link "official website" [ref=f6e29] [cursor=pointer]:
            - /url: https://www.docker.com/products/docker-desktop/
          - text: .
      - paragraph [ref=f6e30]: "Verify installation with:"
      - code [ref=f6e32]: docker --version
      - paragraph
      - heading "Images and Containers" [level=3] [ref=f6e33]
      - paragraph [ref=f6e34]:
        - text: A
        - strong [ref=f6e35]: Docker image
        - text: is like a blueprint, and a
        - strong [ref=f6e36]: container
        - text: "is the running instance. For example:"
      - code [ref=f6e38]: docker run -it ubuntu bash
      - paragraph
      - heading "Your First Container" [level=3] [ref=f6e39]
      - paragraph [ref=f6e40]:
        - text: Here’s a simple
        - code [ref=f6e41]: Dockerfile
        - text: "for a Python app:"
      - code [ref=f6e43]: FROM python:3.9 WORKDIR /app COPY . . RUN pip install -r requirements.txt CMD ["python", "main.py"]
      - paragraph [ref=f6e44]: "Build and run it with:"
      - code [ref=f6e46]: docker build -t my-python-app . docker run my-python-app
      - paragraph
      - 'heading "Example: Containerizing ORB-SLAM3" [level=3] [ref=f6e47]'
      - paragraph [ref=f6e48]: ORB-SLAM3 is a powerful open-source SLAM system. Instead of manually installing dependencies, Docker makes it portable.
      - code [ref=f6e50]: FROM ubuntu:20.04 RUN apt-get update && apt-get install -y \ build-essential cmake git libopencv-dev RUN git clone https://github.com/UZ-SLAMLab/ORB_SLAM3.git /opt/ORB_SLAM3 WORKDIR /opt/ORB_SLAM3 RUN mkdir build && cd build && cmake .. && make -j4 CMD ["/bin/bash"]
      - paragraph [ref=f6e51]: "Build and run:"
      - code [ref=f6e53]: docker build -t orb-slam3 . docker run -it orb-slam3
      - paragraph
      - heading "Conclusion" [level=3] [ref=f6e54]
      - paragraph [ref=f6e55]: Docker simplifies installation, ensures reproducibility, and makes sharing research easier. By containerizing software like ORB-SLAM3, you can avoid compatibility headaches and focus on development. This post covered the basics — in future entries, I’ll dive into more advanced Docker concepts and use cases.
